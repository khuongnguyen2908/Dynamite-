<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The End of the Dynamite</title>
<meta name="description" content="Game sinh tồn hậu tận thế: 60 giây vơ vét trong toà nhà công ty, rồi sống sót dưới hầm với 5 đồng nghiệp.">
<meta name="theme-color" content="#23211E">
<meta property="og:title" content="The End of the Dynamite">
<meta property="og:description" content="60 giây vơ vét, rồi sinh tồn dưới hầm. 27 kết thúc.">
<style>
html,body{margin:0;height:100%;background:#12100E;color:#E6DFCF;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
#boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
#boot h1{font-size:26px;margin:0;letter-spacing:.06em;font-weight:800}
#boot p{margin:0;color:#9A9382;font-size:14px}
#bar{width:260px;height:6px;background:#2A2722;border-radius:3px;overflow:hidden}
#fill{height:100%;width:8%;background:#D3A02C;transition:width .25s}
#err{color:#C2705C;font-size:13px;max-width:520px;line-height:1.5}
#err a{color:#D3A02C}
</style>
</head>
<body>
<div id="boot">
  <h1>THE END OF THE DYNAMITE</h1>
  <p id="msg">Đang tải trò chơi...</p>
  <div id="bar"><div id="fill"></div></div>
  <p id="err"></p>
</div>
<script>
(function(){
  var msg=document.getElementById('msg'), fill=document.getElementById('fill'), err=document.getElementById('err');
  var url='game.html?t='+Date.now();
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.setRequestHeader('Cache-Control','no-cache');
  xhr.onprogress=function(e){
    if(e.lengthComputable){ fill.style.width=Math.max(8,Math.round(e.loaded/e.total*100))+'%'; }
    else { fill.style.width=Math.min(92,8+Math.round(e.loaded/70000))+'%'; }
  };
  xhr.onload=function(){
    if(xhr.status>=200&&xhr.status<400&&xhr.responseText.length>10000){
      fill.style.width='100%'; msg.textContent='Xong.';
      setTimeout(function(){
        document.open(); document.write(xhr.responseText); document.close();
      },120);
    } else { fail('Tải không thành công (mã '+xhr.status+').'); }
  };
  xhr.onerror=function(){ fail('Không kết nối được tới máy chủ.'); };
  function fail(t){
    msg.textContent='Không tải được trò chơi.';
    err.innerHTML=t+'<br>Thử tải lại trang, hoặc mở trực tiếp <a href="game.html">game.html</a>.';
  }
  xhr.send();
})();
</script>
</body>
</html>
